}

/* ==========================================================================
   20. PATTERN LOADING
   ========================================================================== */
function randomUnused(catIdx){
    const used = usedByCat[catIdx];
    if (used.size >= PATTERNS_PER_CAT) used.clear();
    let idx, guard = 0;
    do {
        idx = Math.floor(Math.random() * PATTERNS_PER_CAT);
        guard++;
    } while (used.has(idx) && guard < 9000);
    used.add(idx);
    return idx;
}

function showPattern(index){
    index = ((index % PATTERNS_PER_CAT) + PATTERNS_PER_CAT) % PATTERNS_PER_CAT;
    currentIndex = index;
    usedByCat[currentCat].add(index);

    const area = document.getElementById('coloring-area');
    area.innerHTML = generateSVG(currentCat, index, true);
    setupColoringEvents();

    document.getElementById('patternInput').value = index + 1;
    document.getElementById('speciesTag').textContent =
        CATEGORIES[currentCat].emoji + ' ' + getLabel(currentCat, index);
    pushRecent(index);
}

function pushRecent(index){
    const arr = recentByCat[currentCat];
    const pos = arr.indexOf(index);
    if (pos !== -1) arr.splice(pos, 1);
    arr.unshift(index);
    if (arr.length > 6) arr.pop();
    renderRecent();
}

function renderRecent(){
    const strip = document.getElementById('recent-strip');
    strip.innerHTML = '';
    recentByCat[currentCat].forEach(idx => {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail' + (idx === currentIndex ? ' selected' : '');
        thumb.title = CATEGORIES[currentCat].name + ' #' + (idx + 1) + ' — ' + getLabel(currentCat, idx);
        thumb.innerHTML = generateSVG(currentCat, idx, false);
        thumb.addEventListener('click', () => {
            initAudio(); playPopSound();
            showPattern(idx);
        });
        strip.appendChild(thumb);
    });
}

/* ==========================================================================
   21. COLORING EVENTS
   ========================================================================== */
function setupColoringEvents(){
    const svg = document.getElementById('coloring-svg');
    if (!svg) return;
    const fillableElements = svg.querySelectorAll('.fillable');
    sparkleBudget = 0;

    fillableElements.forEach(el => {
        const colorAction = (e, allowSparkle) => {
            if (e.cancelable) e.preventDefault();
            const currentFill = el.getAttribute('fill');
            if (currentFill === currentColor && currentColor !== '#ffffff') return;

            playPopSound();
            el.setAttribute('fill', currentColor);
            el.classList.remove('pop-anim');
            void el.getBoundingClientRect();
            el.classList.add('pop-anim');

            if (allowSparkle && sparkleBudget < 3){
                sparkleBudget++;
                let x, y;
                if (e.type === 'touchstart' && e.touches && e.touches[0]){
                    x = e.touches[0].clientX; y = e.touches[0].clientY;
                } else { x = e.clientX; y = e.clientY; }
                createSparkle(x, y, currentColor);
            }
        };
        el.addEventListener('mousedown', e => colorAction(e, true));
        el.addEventListener('touchstart', e => colorAction(e, true), { passive: false });
        el.addEventListener('mouseenter', e => { if (e.buttons === 1) colorAction(e, false); });
    });
}

function createSparkle(x, y, color){
    const emojis = ['✨', '⭐', '🎈', '🎨', '💫'];
    const s = document.createElement('div');
    s.className = 'sparkle-effect';
    if (color === '#ffffff'){ s.innerText = '💨'; }
    else {
        s.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.color = color;
        s.style.textShadow = '0 0 3px rgba(0,0,0,.55)';
    }
    s.style.left = (x + (Math.random() - .5) * 44 - 12) + 'px';
    s.style.top  = (y + (Math.random() - .5) * 44 - 12) + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 620);
}

   22. BUTTON ACTIONS
   ========================================================================== */
function resetColors(){
    initAudio(); playPopSound();
    const svg = document.getElementById('coloring-svg');
    if (!svg) return;
    svg.querySelectorAll('.fillable').forEach(el => {
        el.setAttribute('fill', '#ffffff');
        el.classList.remove('pop-anim');
    });
}

function magicFill(){
    initAudio(); playMagicSound();
    const svg = document.getElementById('coloring-svg');
    if (!svg) return;
    const fillables = svg.querySelectorAll('.fillable');
    const safeColors = colors.slice(0, colors.length - 2);
    const delay = Math.max(4, Math.min(26, 900 / Math.max(1, fillables.length)));
    fillables.forEach((el, i) => {
        setTimeout(() => {
            el.setAttribute('fill', safeColors[Math.floor(Math.random() * safeColors.length)]);
            el.classList.remove('pop-anim');
            void el.getBoundingClientRect();
            el.classList.add('pop-anim');
        }, i * delay);
    });
}

function saveImage(){
    initAudio(); playMagicSound();
    const svg = document.getElementById('coloring-svg');
    if (!svg) return;

    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', 1000);
    clone.setAttribute('height', 1000);

    const data = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1000; canvas.height = 1000;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1000, 1000);
        ctx.drawImage(img, 0, 0, 1000, 1000);
        URL.revokeObjectURL(url);
        try {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = CATEGORIES[currentCat].id + '-' + (currentIndex + 1) + '.png';
            document.body.appendChild(a); a.click(); a.remove();
        } catch (err){ console.log('Download blocked.', err); }
        showModal();
    };
    img.onerror = () => { URL.revokeObjectURL(url); showModal(); };
    img.src = url;
}

function showModal(){
    document.getElementById('modalText').textContent =
        CATEGORIES[currentCat].emoji + ' ' + getLabel(currentCat, currentIndex) +
        ' #' + (currentIndex + 1) + ' — a one‑of‑a‑kind masterpiece!';
    document.getElementById('modal').style.display = 'flex';
}
function closeModal(force){
    document.getElementById('modal').style.display = 'none';
    if (force) playPopSound();
}

/* ==========================================================================
   23. INIT
   ========================================================================== */
function init(){
    document.getElementById('patternTotal').textContent = PATTERNS_PER_CAT.toLocaleString();

    buildCategories();
    createPalette();

    CATEGORIES.forEach((_, ci) => {
        for (let i = 0; i < 3; i++){
            const idx = Math.floor(Math.random() * PATTERNS_PER_CAT);
            usedByCat[ci].add(idx);
            recentByCat[ci].push(idx);
        }
    });

    showPattern(randomUnused(0));

    document.getElementById('prevBtn').addEventListener('click', () => {
        initAudio(); playPopSound(); showPattern(currentIndex - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        initAudio(); playPopSound(); showPattern(currentIndex + 1);
    });
    document.getElementById('newBtn').addEventListener('click', () => {
        initAudio(); playMagicSound(); showPattern(randomUnused(currentCat));
    });

    document.getElementById('resetBtn').addEventListener('click', resetColors);
    document.getElementById('magicBtn').addEventListener('click', magicFill);
    document.getElementById('saveBtn').addEventListener('click', saveImage);
    document.getElementById('modalCloseBtn').addEventListener('click', () => closeModal(true));
    document.getElementById('modal').addEventListener('click', e => {
        if (e.target.id === 'modal') closeModal(true);
    });

    const input = document.getElementById('patternInput');
    const jump = () => {
        let v = parseInt(input.value.replace(/[^0-9]/g, ''), 10);
        if (isNaN(v)) v = currentIndex + 1;
        v = Math.max(1, Math.min(PATTERNS_PER_CAT, v));
        initAudio(); playPopSound();
        showPattern(v - 1);
    };
    input.addEventListener('change', jump);
    input.addEventListener('keydown', e => { if (e.key === 'Enter'){ input.blur(); jump(); } });

    document.body.addEventListener('click', initAudio, { once: true });
    document.body.addEventListener('touchstart', initAudio, { once: true });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
